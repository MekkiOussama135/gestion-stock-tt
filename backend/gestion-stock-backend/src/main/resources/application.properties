spring.application.name=gestion-stock-backend

# =========================
# PostgreSQL Configuration
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_stock_tt
spring.datasource.username=postgres
spring.datasource.password=your_postgresql_password_here

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Server
# =========================
server.port=8081

jwt.secret=change-this-to-a-long-random-string-at-least-32-characters-for-hs256
jwt.expiration=86400000

# =========================
# Email (OTP)
# =========================
# Use a Gmail App Password, not your real Gmail password.
# Generate one at: https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_gmail_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

otp.expiration-minutes=5
otp.max-attempts=5

app.admin.username=admin
app.admin.password=admin123
app.admin.email=admin@tunisietelecom.tn